; Production overrides on top of php.ini-production.

; Never print errors to visitors; Laravel renders its own error pages.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Do not advertise the PHP version in an X-Powered-By header.
expose_php = Off

; Keep function arguments (passwords, tokens, card data) out of stack traces.
zend.exception_ignore_args = On

; Session cookie hardening for anything that starts a native session.
session.use_strict_mode = 1
session.cookie_httponly = 1

; Uploads: product images are at most 4 MB each, several per request.
upload_max_filesize = 8M
post_max_size = 32M
max_file_uploads = 20

; Opcache for speed in a read-only container.
opcache.enable = 1
opcache.validate_timestamps = 0
